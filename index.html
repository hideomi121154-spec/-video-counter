<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Video Counter</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="動画カウンター">
    <section id="videoPane" class="video-pane" aria-label="動画エリア">
      <div class="player-wrap">
        <button id="openVideoSettings" class="video-settings-btn" type="button" aria-label="YouTube動画を設定">⚙︎</button>
        <div id="playerPlaceholder" class="player-placeholder" aria-hidden="true"></div>
        <iframe id="youtubePlayer" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
      </div>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="動画とカウンターの高さを調整" tabindex="0">
      <span class="splitter-grip"></span>
    </div>

    <section id="counterPane" class="counter-pane" aria-label="カウンターエリア">
      <div class="counter-topbar">
        <div class="mode-tabs" role="tablist" aria-label="記録モード">
          <button class="mode-tab is-active" data-mode="A" role="tab" aria-selected="true">A</button>
          <button class="mode-tab" data-mode="B" role="tab" aria-selected="false">B</button>
          <button class="mode-tab" data-mode="C" role="tab" aria-selected="false">C</button>
          <button class="mode-tab" data-mode="D" role="tab" aria-selected="false">D</button>
          <button class="mode-tab" data-mode="E" role="tab" aria-selected="false">E</button>
          <button class="mode-tab" data-mode="F" role="tab" aria-selected="false">F</button>
        </div>
        <button id="resetMode" class="icon-btn danger" type="button" aria-label="現在のモードをリセット">リセット</button>
      </div>

      <section class="summary-card" aria-live="polite">
        <div>
          <div class="eyebrow">GAME</div>
          <div id="gameCount" class="big-number">0</div>
        </div>
        <div class="game-actions">
          <button id="gameMinus" class="round-btn secondary" type="button" aria-label="ゲーム数を1減らす">−</button>
          <button id="gamePlus" class="round-btn primary" type="button" aria-label="ゲーム数を1増やす">＋</button>
        </div>
      </section>

      <div id="counterGrid" class="counter-grid" aria-label="5種類のカウンター"></div>

      <details class="tools">
        <summary>補助計算</summary>
        <div class="tool-grid">
          <label>打ち始めGm<input id="startGame" type="number" min="0" step="1" inputmode="numeric" /></label>
          <label>総Gm<input id="totalGame" type="number" min="0" step="1" inputmode="numeric" /></label>
          <div class="tool-output"><span>個人Gm</span><strong id="personalGame">0</strong></div>
        </div>
        <div class="tool-grid tool-grid-rate">
          <label>試行回数<input id="trialCount" type="number" min="0" step="1" inputmode="numeric" /></label>
          <label>突入回数<input id="hitCount" type="number" min="0" step="1" inputmode="numeric" /></label>
          <div class="tool-output"><span>突入率</span><strong id="hitRate">—</strong></div>
        </div>
      </details>

      <div class="footer-row">
        <span id="saveStatus" class="save-status">自動保存</span>
        <button id="clearAll" class="text-btn" type="button">全データ削除</button>
      </div>
    </section>
  </main>

  <dialog id="videoDialog">
    <form method="dialog" class="dialog-card video-dialog-card">
      <h2>動画設定</h2>
      <label class="dialog-label" for="youtubeUrl">YouTube URL</label>
      <input id="youtubeUrl" inputmode="url" autocomplete="off" placeholder="https://youtu.be/..." aria-label="YouTube URL" />
      <p id="videoError" class="dialog-error" role="alert" hidden>有効なYouTube URLまたは動画IDを入力してください。</p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">キャンセル</button>
        <button id="clearVideo" value="clear" class="btn" type="button">動画解除</button>
        <button id="loadVideo" value="confirm" class="btn btn-primary" type="button">設定</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2 id="dialogTitle">確認</h2>
      <p id="dialogMessage">削除しますか？</p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">キャンセル</button>
        <button value="confirm" class="btn btn-danger">削除</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
